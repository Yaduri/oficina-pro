name: Operação diária (Backup, Restauração, Saúde e Limpeza)

on:
  schedule:
    # Todo dia às 03:00 (Horário de Brasília = 06:00 UTC)
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  backup-e-restauracao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Backup diário da produção para Cloudflare R2
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          CHAVE_CRIPTOGRAFIA: ${{ secrets.PROD_CHAVE_CRIPTOGRAFIA }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.PROD_R2_BUCKET }}
        run: node scripts/backup.mjs prod

      - name: Testar restauração do backup recém-gerado
        env:
          CHAVE_CRIPTOGRAFIA: ${{ secrets.PROD_CHAVE_CRIPTOGRAFIA }}
        run: node scripts/testar-restauracao.mjs prod

      - name: Verificar saúde da produção (/api/saude)
        run: |
          curl --fail --silent --show-error https://oficina.yagoduarte.com.br/api/saude

      - name: Limpar fotos órfãs no R2 (domingos)
        if: ${{ github.event_name == 'workflow_dispatch' || format('{0}', github.event.schedule) != '' }}
        env:
          CRON_SECRET: ${{ secrets.PROD_CRON_SECRET }}
        run: |
          if [ -n "$CRON_SECRET" ] && [ "$(date +%u)" = "7" ]; then
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              https://oficina.yagoduarte.com.br/api/operacao/limpar-orfas
          fi
